site_name: 'Gut Check: The Neuroscience of How Your Gut and Brain Talk'
site_description: 'A free, interactive neuroscience textbook for teens, patients, and families on how the gut and brain communicate, and how to tell real science from hype.'
site_author: 'Aaryav Sharma'
site_url: 'https://aaryavvatts-lab.github.io/gut-brain-textbook/'

